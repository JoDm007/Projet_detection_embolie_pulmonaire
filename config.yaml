# config.yaml

project:
  name: "FUMPE Embolie Detection"
  version: "1.0.0"
  seed: 42  #  Pour reproductibilité (split, torch, numpy)

data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  splits_path: "data/splits"
  figures_path: "figures"
  logs_path: "logs"

preprocessing:
  # Fenêtrage Hounsfield — Fenêtre pulmonaire pour embolie (FUMPE)
  # [-600, 400] : coupe l'air profond et l'os, conserve parenchyme + vaisseaux contrastés + thrombus
  hu_window: [-600, 400]  # Validé : fenêtre standard détection EP avec contraste
  
  # Resampling (Critique pour CNN 3D)
  target_spacing: [1.0, 1.0, 1.0]  # Isotropique 1mm³ (Z, Y, X)
  
  # Normalisation
  normalize: true  # Min-Max scaling vers [0, 1]
  
  # Taille d'entrée pour le Deep Learning (optionnel si padding)
  target_size: [512, 512]  # XY seulement, Z géré par spacing

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: false  #  À mettre à true dès qu'on aura des métadonnées de sévérité

model:
  # Placeholder pour les Objectifs 4 & 5
  type: "CNN3D"  # ou "SVM", "RandomForest"
  input_channels: 1
  num_classes: 2
  learning_rate: 0.001
  batch_size: 4
  epochs: 50

# config.yaml - Section Objectif 2 (détection classique)
classical_detection:
  lung_segmentation:
    hu_threshold: -400
    min_area: 1000
  # Mode 'bright' (approche B) : détecte les régions brillantes du lumen vasculaire,
  # alignées sur le GT FUMPE. Ancien mode 'percentile' conservé dans le code pour comparaison.
  detection_mode: bright
  vessel_min_hu: 100          # seuil "lumen vasculaire opacifié"
  max_hu: 400                 # exclut l'os
  min_candidate_volume: 50    # supprime le petit bruit
  max_candidate_volume: null  # pas de plafond (le cap à 5000 jetait les grosses embolies)
  # --- Ancien mode percentile (désactivé, pour référence) ---
  thresholding:
    method: percentile
    percentile: 95
    min_hu: 50

# config.yaml - Section Objectif 4
radiomics:
  # Paramètres du sélecteur
  selector:
    variance_threshold: 0.01
    correlation_threshold: 0.95
    top_k_features: 20
    selection_method: "random_forest"
  
  # Chemins
  features_path: "data/processed/radiomics_features.csv"
  selector_path: "models/radiomics_selector.pkl"
  figures_path: "figures/radiomics"
  
  # Labels (à adapter selon ton dataset)
  label_column: "has_embolism"  # ou "label", "target", etc.
  
  # Split pour entraînement du sélecteur (optionnel)
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15


  # config.yaml - Section Objectif 5
classical_models:
  # Paramètres des modèles
  models:
    random_forest:
      n_estimators: 200
      max_depth: 10
      class_weight: "balanced"
    svm:
      C: 1.0
      kernel: "rbf"
      class_weight: "balanced"
    logistic_regression:
      C: 1.0
      class_weight: "balanced"
    xgboost:
      n_estimators: 200
      max_depth: 10
      learning_rate: 0.1
      use_label_encoder: false
      eval_metric: "logloss"
  
  # Chemins
  features_path: "data/processed/radiomics_features_selected.csv"  # Features sélectionnées
  results_path: "results/classical_models_results.csv"
  figures_path: "figures/classical_models"
  
  # Labels (doit correspondre au label_column de radiomics)
  label_column: "has_embolism"
  
  # Split pour entraînement/test
  train_ratio: 0.7
  test_ratio: 0.3

  ""